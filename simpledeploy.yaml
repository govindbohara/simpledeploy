app: my-node-app

target:
  host: "13.54.xx.xx"
  user: "ubuntu"
  port: 22
  keyPath: "/Users/you/.ssh/ec2-key.pem"

build:
  local:
    - "echo 'Building the application...'"
    - "npm ci"
    - "npm run build"

package:
  include:
    - "dist/**"
    - "package.json"
    - "package-lock.json"

start:
  cmd: "node dist/server.js"

env:
  NODE_ENV: "production"
  PORT: "3000"
